<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Примерочная | AI Fashion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          screens: {
            'md': '960px',
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 0.06) 0, transparent 50%),
        radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 0.06) 0, transparent 50%),
        radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 0.06) 0, transparent 50%);
    }

    /* Ультра-заметный Liquid Glass */
    .liquid-glass {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.5) 100%);
      backdrop-filter: blur(80px) saturate(220%);
      -webkit-backdrop-filter: blur(80px) saturate(220%);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow:
        0 40px 80px -12px rgba(0, 0, 0, 0.25),
        inset 0 0 15px rgba(255, 255, 255, 0.8),
        inset 0 0 2px rgba(255, 255, 255, 1);
    }

    .liquid-glass-dark {
      background: linear-gradient(135deg, rgba(0, 0, 0, 0.05) 0%, rgba(0, 0, 0, 0.02) 100%);
      backdrop-filter: blur(100px) saturate(190%);
      -webkit-backdrop-filter: blur(100px) saturate(190%);
      border: 1px solid rgba(0, 0, 0, 0.04);
      box-shadow:
        0 40px 80px -12px rgba(0, 0, 0, 0.15),
        inset 0 0 5px rgba(255, 255, 255, 0.05);
    }

    .glass-button {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.6) 100%);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 1);
      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.05),
        inset 0 0 12px rgba(255, 255, 255, 1);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-button:hover {
      background: #FFFFFF;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12);
      transform: scale(1.05);
    }

    .grid-stack {
      display: inline-grid;
      grid-template-areas: "stack";
      align-items: center;
      justify-items: center;
      vertical-align: middle;
    }

    .grid-stack>* {
      grid-area: stack;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .floating-card {
      box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.1);
      transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .floating-card:hover {
      transform: scale(1.02);
      box-shadow: 0 50px 100px -25px rgba(0, 0, 0, 0.18);
    }

    ::-webkit-scrollbar {
      display: none;
    }

    button {
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        text-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
